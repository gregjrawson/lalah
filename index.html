<script>
(() => {
  'use strict';

  // ---------- CONFIG ----------
  const DEV_LOC = 'dev';
  const DESKTOP_BREAKPOINT = 900;
  const RECENT_BLOCK = 5;
  const REWARD_SECONDS = 60;

  // ✅ PASS/FAIL logger (pings Apps Script)
  const RESULT_WEBAPP = 'https://script.google.com/macros/s/AKfycbzz3yGeLl-BAdWdLwU_gFwsQ9qKCT1tXtoxvcZUaqWybju8HONDdd9yzeltZbhVKt2N/exec';

  const sendResult = (result) => {
    const loc = (new URLSearchParams(window.location.search).get('loc') || '').trim();
    if (!loc) return;

    // image ping = safest (no CORS issues, never blocks UI)
    const img = new Image();
    img.src =
      RESULT_WEBAPP
      + '?loc=' + encodeURIComponent(loc)
      + '&result=' + encodeURIComponent(result)
      + '&v=' + Date.now();
  };

  // ---------- DOM ----------
  const desktopBlocker = document.getElementById('desktopBlocker');
  const qrGate = document.getElementById('qrGate');
  const wrap = document.querySelector('.wrap');

  const screenPhone = document.getElementById('screen-phone');
  const screenPhrase = document.getElementById('screen-phrase');
  const screenReward = document.getElementById('screen-reward');
  const successMain = document.getElementById('successMain');
  const screenFail = document.getElementById('screen-fail');
  const screenLocal = document.getElementById('screen-local');
  const homeTitle = document.getElementById('homeTitle');

  const phoneInput = document.getElementById('phone');
  const phoneMsg = document.getElementById('phoneMsg');
  const btnEnter = document.getElementById('btnEnter');

  const phraseText = document.getElementById('phraseText');
  const btnGood = document.getElementById('btnGood');
  const btnSalah = document.getElementById('btnSalah');
  const btnRetry = document.getElementById('btnRetry');

  const timerText = document.getElementById('timerText');
  const expireMsg = document.getElementById('expireMsg');
  const failBottom = document.getElementById('failBottom');

  const storeModal = document.getElementById('storeModal');
  const closeStores = document.getElementById('closeStores');
  const storeLinks = document.querySelectorAll('.store-link');

  if(!wrap || !screenPhone || !screenPhrase || !screenReward || !screenFail){
    console.error('LaLah: missing core DOM nodes.');
    return;
  }

  // ---------- HELPERS ----------
  const qs = () => new URLSearchParams(window.location.search);
  const getLoc = () => (qs().get('loc') || '').trim().toLowerCase();
  const isDev = () => getLoc() === DEV_LOC;

  const isDesktopLike = () => {
    const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const wideScreen = window.innerWidth >= DESKTOP_BREAKPOINT;
    return finePointer || wideScreen;
  };

  const show = el => { if(el) el.style.display = 'block'; };
  const hide = el => { if(el) el.style.display = 'none'; };

  const setBg = which => {
    if(which === 'light') document.body.style.backgroundImage = 'url(\'bg-light.jpg\')';
    else if(which === 'dark') document.body.style.backgroundImage = 'url(\'bg-blank.jpg\')';
    else document.body.style.backgroundImage = 'url(\'bg-blank.jpg\')';
  };

  // ---------- GATES ----------
  const applyGates = () => {
    const desktop = isDesktopLike();
    const loc = getLoc();
    const hasLoc = !!loc;
    const dev = isDev() || qs().get('test') === '1';

    if (desktop && !dev) {
      if (desktopBlocker) desktopBlocker.style.display = 'flex';
      if (qrGate) qrGate.style.display = 'none';
      wrap.style.display = 'none';
      return;
    }

    if (!desktop && !dev && !hasLoc) {
      if (desktopBlocker) desktopBlocker.style.display = 'none';
      if (qrGate) qrGate.style.display = 'flex';
      wrap.style.display = 'none';
      return;
    }

    if (desktopBlocker) desktopBlocker.style.display = 'none';
    if (qrGate) qrGate.style.display = 'none';
    wrap.style.display = '';
  };

  let gateRaf = 0;
  const scheduleGates = () => {
    if(gateRaf) cancelAnimationFrame(gateRaf);
    gateRaf = requestAnimationFrame(() => {
      gateRaf = 0;
      applyGates();
    });
  };

  window.addEventListener('load', scheduleGates);
  window.addEventListener('resize', scheduleGates);
  window.addEventListener('orientationchange', scheduleGates);

  // ---------- DATA ----------
  const HOME_TITLE_TEXT = 'SPEAK SINGLISH, GET MORE';

  const PHRASES = [
    'Steady lah, got standard',
    'Hosei liao',
    'Queue until like this, must be good eh',
    'Can tapao or not ah?',
    'Wah lao today very hot sia',
    'Uncle kopi-c siew dai',
    'Kuah simi kuah?',
    'Wah this one damn shiok',
    'Alamak why like that',
    'This one power lah',
    'Auntie give chance can or not',
    'Eh don\'t play play',
    'Confirm plus chop',
    'Die die must try',
    'Wah this one next level sia',
    'Sibei solid',
    'Can lah can lah',
    'Jialat already',
    'Chope first ah',
    'Walao eh don\'t bluff me',
    'Paiseh ah first time',
    'Kopi-c siew dai can or cannot',
    'Don\'t so kiasu lah',
    'Wah I blur like sotong already'
  ];

  const FAIL_BOTTOM_LINES = [
    'Well done.<br>You invented new Singlish.<br>But wrong mission, lor.',
    'Nice attempt!<br>But no, lor.',
    'Wah, creative sia.<br>But no.',
    'Effort can.<br>Result cannot.',
    'You committed fully.<br>To the wrong delivery.',
    'Great effort.<br>You created a remix of Singlish.<br>But original version only, lah.'
  ];

  const SUCCESS_LINES = [
    'You got<br>standard',
    'Singlish<br>mastered',
    'Standard<br>achieved',
    'Mission<br>steady',
    'Just like<br>a local',
    'Shiok<br>confirmed',
    'Local<br>approved'
  ];

  const PHRASE_BREAKS = {
    'Steady lah, got standard': 'Steady lah,<br>got standard',
    'Queue until like this, must be good eh': 'Queue until<br>like this, must<br>be good eh',
    'Wah lao today very hot sia': 'Wah lao today<br>very hot sia',
    'Auntie give chance can or not': 'Auntie<br>give chance can<br>or not',
    'Kopi-c siew dai can or cannot': 'Kopi-c siew dai<br>can or cannot',
    'Kuah simi kuah?': 'Kuah simi<br>kuah?',
    'Die die must try': 'Die die<br>must try',
    'Wah this one next level sia': 'Wah this one<br>next level sia',
    'Don\'t so kiasu lah': 'Don\'t so<br>kiasu lah',
    'Can lah can lah': 'Can lah<br>can lah',
    'Paiseh ah first time': 'Paiseh ah<br>first time',
    'Eh don\'t play play': 'Eh don\'t<br>play play',
    'Wah I blur like sotong already': 'Wah I blur like<br>sotong already',
    'Walao eh don\'t bluff me': 'Walao eh<br>don\'t bluff me',
    'Can tapao or not ah?': 'Can tapao<br>or not ah?',
    'Uncle kopi-c siew dai': 'Uncle kopi-c<br>siew dai',
    'Confirm plus chop': 'Confirm<br>plus chop',
    'This one power lah': 'This one<br>power lah',
    'Wah this one damn shiok': 'Wah this one<br>damn shiok',
    'Alamak why like that': 'Alamak why<br>like that'
  };

  // ---------- STORE MODAL ----------
  storeLinks.forEach(el => el.addEventListener('click', () => {
    if(storeModal) storeModal.style.display = 'flex';
  }));

  // ---------- ABOUT MODAL ----------
  const aboutLink = document.getElementById('aboutLink');
  const aboutLinkDesktop = document.getElementById('aboutLinkDesktop');
  const aboutModal = document.getElementById('aboutModal');
  const closeAbout = document.getElementById('closeAbout');

  if(aboutLink){
    aboutLink.addEventListener('click', (e) => {
      e.preventDefault();
      if(aboutModal) aboutModal.style.display = 'flex';
    });
  }

  if(aboutLinkDesktop){
    aboutLinkDesktop.addEventListener('click', (e) => {
      e.preventDefault();
      if(aboutModal) aboutModal.style.display = 'flex';
    });
  }

  if(closeAbout){
    closeAbout.addEventListener('click', () => {
      if(aboutModal) aboutModal.style.display = 'none';
    });
  }

  if(aboutModal){
    aboutModal.addEventListener('click', (e) => {
      if(e.target === aboutModal){
        aboutModal.style.display = 'none';
      }
    });
  }

  if(closeStores) closeStores.addEventListener('click', () => { if(storeModal) storeModal.style.display = 'none'; });
  if(storeModal) storeModal.addEventListener('click', e => { if(e.target === storeModal) storeModal.style.display = 'none'; });

  // ---------- intl-tel-input ----------
  const iti = window.intlTelInput(phoneInput, {
    separateDialCode: true,
    initialCountry: 'us',
    preferredCountries: ['us'],
    nationalMode: true,
    autoPlaceholder: 'off',
    formatOnDisplay: false,
    utilsScript: 'https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js',
  });
  iti.setCountry('us');

  // ---------- STATE ----------
  let currentPhrase = '';
  const recentPhrases = [];

  let currentFailLine = '';
  const recentFailLines = [];

  let rewardTimer = null;
  let secondsLeft = 0;

  let typer = null;
  let typeDelay = null;
  let currentDisplayText = '';

  const cancelTyping = () => {
    if(typer){ clearInterval(typer); typer = null; }
    if(typeDelay){ clearTimeout(typeDelay); typeDelay = null; }
  };

  // ---------- NAV ----------
  const gotoPhone = () => {
    cancelTyping();
    hide(screenPhrase); hide(screenReward); hide(screenFail);
    show(screenPhone);
    stopTimer();
    setBg('light');
    typeHomeTitle();
  };

  const gotoPhrase = () => {
    cancelTyping();
    hide(screenPhone); hide(screenReward); hide(screenFail);
    show(screenPhrase);
    stopTimer();
    setNewPhrase();
    setBg('blank');
  };

  const gotoReward = () => {
    cancelTyping();
    hide(screenPhone); hide(screenPhrase); hide(screenFail);
    show(screenReward);
    setBg('blank');

    let next;
    do {
      next = SUCCESS_LINES[Math.floor(Math.random() * SUCCESS_LINES.length)];
    } while (next === successMain.innerHTML);

    successMain.innerHTML = next;
  };

  const gotoFail = () => {
    cancelTyping();
    hide(screenPhone); hide(screenPhrase); hide(screenReward);
    show(screenFail);
    setBg('blank');

    if(failBottom){
      let next = currentFailLine;
      do{
        next = FAIL_BOTTOM_LINES[Math.floor(Math.random() * FAIL_BOTTOM_LINES.length)];
      } while(recentFailLines.includes(next) || next === currentFailLine);

      currentFailLine = next;
      recentFailLines.push(currentFailLine);
      if(recentFailLines.length > RECENT_BLOCK) recentFailLines.shift();

      failBottom.innerHTML = currentFailLine;
    }
  };

  const gotoLocalBlock = () => {
    cancelTyping();
    hide(screenPhone);
    hide(screenPhrase);
    hide(screenReward);
    hide(screenFail);
    show(screenLocal);
    setBg('blank');
  };

  const typeHomeTitle = () => {
    if (!homeTitle) return;

    homeTitle.innerHTML = '';
    let i = 0;

    const text = HOME_TITLE_TEXT;
    const duration = 900;
    const intervalTime = duration / text.length;

    setTimeout(() => {
      typer = setInterval(() => {
        homeTitle.innerHTML += text[i] || '';
        i++;
        if (i >= text.length) {
          clearInterval(typer);
        }
      }, intervalTime);
    }, 1000);
  };

  // ---------- PHRASES ----------
  const setNewPhrase = () => {
    let next = currentPhrase;

    do{
      next = PHRASES[Math.floor(Math.random() * PHRASES.length)];
    } while(recentPhrases.includes(next) || next === currentPhrase);

    currentPhrase = next;

    recentPhrases.push(currentPhrase);
    if(recentPhrases.length > RECENT_BLOCK) recentPhrases.shift();

    const displayText = PHRASE_BREAKS[currentPhrase] || currentPhrase;
    currentDisplayText = displayText;

    cancelTyping();
    phraseText.innerHTML = '';

    phraseText.classList.remove('lines-1','lines-2','lines-3','lines-4');

    const bubbleW = phraseText.parentElement.getBoundingClientRect().width;
    const measure = document.createElement('div');

    measure.style.position = 'absolute';
    measure.style.left = '-9999px';
    measure.style.top = '0';
    measure.style.visibility = 'hidden';
    measure.style.pointerEvents = 'none';

    const cs = window.getComputedStyle(phraseText);
    measure.style.fontFamily = cs.fontFamily;
    measure.style.fontSize = cs.fontSize;
    measure.style.fontWeight = cs.fontWeight;
    measure.style.letterSpacing = cs.letterSpacing;
    measure.style.lineHeight = cs.lineHeight;
    measure.style.textTransform = cs.textTransform;
    measure.style.whiteSpace = 'normal';
    measure.style.wordBreak = 'normal';
    measure.style.overflowWrap = cs.overflowWrap || 'break-word';

    measure.style.width = (bubbleW * 0.75) + 'px';

    measure.innerHTML = displayText;
    document.body.appendChild(measure);

    const lh = parseFloat(window.getComputedStyle(measure).lineHeight);
    const h = measure.getBoundingClientRect().height;

    document.body.removeChild(measure);

    let lineCount = 1;
    if (lh && h) lineCount = Math.round(h / lh);

    lineCount = Math.max(1, Math.min(4, lineCount));
    phraseText.classList.add('lines-' + lineCount);

    let i = 0;

    typeDelay = setTimeout(() => {
      typeDelay = null;

      const cleanLen = displayText.replace(/<br>/g, '').length;
      const base = 1000;
      const duration = Math.max(base, cleanLen * 40);
      const intervalTime = duration / Math.max(cleanLen, 1);

      typer = setInterval(() => {
        if(screenPhrase.style.display === 'none'){
          cancelTyping();
          return;
        }

        if(displayText.substr(i, 4) === '<br>'){
          phraseText.innerHTML += '<br>';
          i += 4;
        }else{
          phraseText.innerHTML += displayText[i] || '';
          i++;
        }

        if(i >= displayText.length){
          cancelTyping();
        }
      }, intervalTime);
    }, 1000);
  };

  // ---------- VALIDATION ----------
  const enterApp = () => {
    const dial = iti.getSelectedCountryData().dialCode;
    const rawValue = (phoneInput.value || '').trim();
    const num = rawValue.replace(/\D/g, '');

    if(dial === '65'){
      phoneMsg.textContent = '';
      gotoLocalBlock();
      return;
    }

    const fail = () => { phoneMsg.textContent = 'Invalid number lah.'; };

    if(!rawValue) return fail();
    if(/[a-zA-Z]/.test(rawValue)) return fail();
    if(num.length < 7 || num.length > 15) return fail();

    const hasUtils = (typeof window.intlTelInputUtils !== 'undefined');
    if(hasUtils){
      if(!iti.isValidNumber()) return fail();
    }

    if(/^(\d)\1+$/.test(num)) return fail();
    if(/0000$/.test(num) || /1234$/.test(num) || /5555$/.test(num)) return fail();

    const isRepeatOf = (s, size) => {
      if(s.length % size !== 0) return false;
      const chunk = s.slice(0, size);
      const reps = s.length / size;
      if(reps < 2) return false;
      return chunk.repeat(reps) === s;
    };
    if(isRepeatOf(num, 2) || isRepeatOf(num, 3) || isRepeatOf(num, 4)) return fail();

    const counts = {};
    for(const ch of num) counts[ch] = (counts[ch] || 0) + 1;
    if(Math.max(...Object.values(counts)) >= Math.max(5, Math.ceil(num.length * 0.6))) return fail();

    let asc = true, desc = true;
    for(let i=1;i<num.length;i++){
      const prev = Number(num[i-1]);
      const cur  = Number(num[i]);
      if(cur !== prev + 1) asc = false;
      if(cur !== prev - 1) desc = false;
    }
    if(asc || desc) return fail();

    phoneMsg.textContent = '';
    gotoPhrase();
  };

  // ---------- TIMER ----------
  const updateTimer = () => {
    const m = Math.floor(secondsLeft/60);
    const s = secondsLeft%60;
    timerText.textContent = `Valid for: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };

  const stopTimer = () => {
    if(rewardTimer){
      clearInterval(rewardTimer);
      rewardTimer = null;
    }
  };

  const startTimer = t => {
    stopTimer();
    secondsLeft = t;
    updateTimer();
    rewardTimer = setInterval(() => {
      secondsLeft--;
      updateTimer();
      if(secondsLeft <= 0){
        stopTimer();
        gotoPhone();
      }
    }, 1000);
  };

  // ---------- EVENTS ----------
  btnEnter.addEventListener('click', enterApp);
  phoneInput.addEventListener('keydown', e => { if(e.key === 'Enter') enterApp(); });

  // ✅ FAIL = Salah button
  btnSalah.addEventListener('click', () => {
    sendResult('FAIL');
    gotoFail();
  });

  btnRetry.addEventListener('click', gotoPhrase);

  // ✅ PASS = Good lah button
  btnGood.addEventListener('click', () => {
    sendResult('PASS');

    if(window.confetti){
      confetti({
        particleCount: 100,
        spread: 75,
        startVelocity: 40,
        origin: { y: 0.6 },
        colors: ['#ff2d55', '#ffffff', '#ff6b81']
      });
    }
    gotoReward();
    startTimer(REWARD_SECONDS);
  });

  // ---------- BOOT ----------
  scheduleGates();
  gotoPhone();

})();
</script>
